<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AutoSubs Refresh</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>AutoSubs Refresh</h1>
    <p class="subtitle">Fix broken caption animations across the whole timeline.</p>

    <button id="refresh-btn">Refresh Captions</button>

    <p id="status" class="status">
      Make sure <code>RefreshCaptionsWatcher</code> is running in Resolve
      (Workspace &gt; Scripts &gt; Utility), then click the button.
    </p>
  </main>
  <script src="main.js"></script>
</body>
</html>
