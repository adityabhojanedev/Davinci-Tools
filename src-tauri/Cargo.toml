[package]
name = "autosubs-refresh"
version = "0.1.0"
description = "One-button refresh for broken AutoSubs Text+ captions in DaVinci Resolve"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "autosubs-refresh"
path = "src/main.rs"
